<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">ErrandLab</title>
  <desc id="d">ErrandLab: plan errands around uncertain travel, closing times and a deadline home. Capi the capybara sits beside an animated route.</desc>

  <defs>
    <radialGradient id="warm" cx="0.80" cy="0.78" r="0.55">
      <stop offset="0" stop-color="#F0865A" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F0865A" stop-opacity="0"/>
    </radialGradient>
    <path id="route" d="M720 152 Q800 116 880 146 T1040 136 T1200 146"/>
  </defs>

  <style>
    text { font-family: -apple-system, "SF Pro Display", "Segoe UI", Inter, "Helvetica Neue", Arial, sans-serif; }

    /* one-time entrance */
    .rise   { animation: rise 1.1s cubic-bezier(.2,.7,.2,1) both; }
    .rise.d1{ animation-delay: .15s; }
    .rise.d2{ animation-delay: .30s; }
    .rise.d3{ animation-delay: .45s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* route */
    .flow { stroke-dasharray: 2 11; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -26; } }

    /* stops */
    .ring { transform-box: fill-box; transform-origin: center; animation: ping 3.2s ease-out infinite; opacity: 0; }
    .ring.s2 { animation-delay: .8s; }
    .ring.s3 { animation-delay: 1.6s; }
    .ring.s4 { animation-delay: 2.4s; }
    @keyframes ping { 0% { transform: scale(.6); opacity: .55; } 70%,100% { transform: scale(2.4); opacity: 0; } }

    /* Capi */
    .capi  { animation: bob 3.4s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .head  { transform-box: fill-box; transform-origin: 20% 80%; animation: nod 3.4s ease-in-out infinite; }
    @keyframes nod { 0%,100% { transform: rotate(0); } 50% { transform: rotate(-2deg); } }
    .eye   { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
    @keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    .ear   { transform-box: fill-box; transform-origin: 50% 100%; animation: twitch 6s infinite; }
    @keyframes twitch { 0%,88%,100% { transform: rotate(0); } 91% { transform: rotate(-14deg); } 94% { transform: rotate(4deg); } }
    .shadow{ transform-box: fill-box; transform-origin: center; animation: shade 3.4s ease-in-out infinite; }
    @keyframes shade { 0%,100% { transform: scaleX(1); opacity: .35; } 50% { transform: scaleX(.94); opacity: .25; } }

    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- background -->
  <rect width="1280" height="360" fill="#0D1117"/>
  <rect width="1280" height="360" fill="url(#warm)"/>

  <!-- left: type -->
  <g>
    <text class="rise" x="96" y="112" font-size="13" font-weight="600" letter-spacing="4.5" fill="#6E7681">TRIPLE H HACKATHON 2026</text>
    <text class="rise d1" x="92" y="196" font-size="84" font-weight="700" letter-spacing="-3" fill="#F0F6FC">Errand<tspan fill="#F0865A">Lab</tspan></text>
    <text class="rise d2" x="96" y="246" font-size="21" font-weight="400" fill="#8B949E">Plan errands around uncertain travel,</text>
    <text class="rise d2" x="96" y="276" font-size="21" font-weight="400" fill="#8B949E">closing times and a deadline home.</text>
  </g>

  <!-- right: scene -->
  <g class="rise d3">
    <!-- ground -->
    <line x1="700" y1="276" x2="1240" y2="276" stroke="#30363D" stroke-width="1.5" stroke-linecap="round"/>

    <!-- route -->
    <use href="#route" fill="none" stroke="#F0865A" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round" class="flow"/>

    <!-- stop pulses -->
    <circle class="ring"    cx="720"  cy="152" r="7" fill="none" stroke="#F0865A" stroke-width="1.5"/>
    <circle class="ring s2" cx="880"  cy="146" r="7" fill="none" stroke="#F0865A" stroke-width="1.5"/>
    <circle class="ring s3" cx="1040" cy="136" r="7" fill="none" stroke="#F0865A" stroke-width="1.5"/>
    <circle class="ring s4" cx="1200" cy="146" r="7" fill="none" stroke="#F0865A" stroke-width="1.5"/>

    <!-- stops -->
    <circle cx="720"  cy="152" r="6" fill="#0D1117" stroke="#F0F6FC" stroke-width="2"/>
    <circle cx="880"  cy="146" r="6" fill="#F0865A"/>
    <circle cx="1040" cy="136" r="6" fill="#F0865A"/>
    <circle cx="1200" cy="146" r="6" fill="#F0865A"/>

    <!-- traveller dot -->
    <circle r="5" fill="#F0F6FC">
      <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#route"/>
      </animateMotion>
    </circle>

    <!-- Capi -->
    <ellipse class="shadow" cx="976" cy="278" rx="84" ry="6" fill="#000" opacity=".35"/>
    <g transform="translate(870 172)">
    <g class="capi">
      <g>
        <!-- legs -->
        <rect x="36"  y="78" width="16" height="26" rx="6" fill="#8F5E2E"/>
        <rect x="60"  y="78" width="16" height="26" rx="6" fill="#7E5127"/>
        <rect x="118" y="78" width="16" height="26" rx="6" fill="#8F5E2E"/>
        <rect x="142" y="78" width="16" height="26" rx="6" fill="#7E5127"/>
        <!-- body -->
        <rect x="20" y="34" width="150" height="62" rx="31" fill="#B9824A"/>
        <rect x="42" y="40" width="96" height="14" rx="7" fill="#CF9A62" opacity=".55"/>
      </g>
      <g class="head">
        <!-- head + snout -->
        <rect x="140" y="26" width="64" height="54" rx="24" fill="#C28C54"/>
        <rect x="176" y="42" width="38" height="36" rx="17" fill="#A9753F"/>
        <ellipse cx="208" cy="52" rx="4.2" ry="3.2" fill="#3B2412"/>
        <path d="M190 72 q8 5 18 0" fill="none" stroke="#7E5127" stroke-width="2" stroke-linecap="round"/>
        <!-- ear -->
        <ellipse class="ear" cx="153" cy="30" rx="7" ry="9" fill="#8F5E2E"/>
        <!-- eye -->
        <ellipse class="eye" cx="173" cy="47" rx="3.6" ry="4" fill="#2B1B0E"/>
        <circle cx="174.2" cy="45.6" r="1.1" fill="#F0F6FC" opacity=".85"/>
      </g>
    </g>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
